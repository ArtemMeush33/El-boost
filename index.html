<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="EICR Voice"><meta name="theme-color" content="#09090b"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>EICR Voice</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
/* layout: shadcn/ui dark (zinc). one screen: header, heat-map card filling the rest, talk button pinned at the bottom */
:root{
  --background:#09090b; --foreground:#fafafa; --card:#09090b; --muted:#27272a; --muted-foreground:#a1a1aa;
  --border:#27272a; --input:#27272a; --primary:#fafafa; --primary-foreground:#18181b; --secondary:#27272a;
  --destructive:#dc2626; --ring:#d4d4d8; --radius:.5rem;
  /* heat map (data viz) */
  --cell:#18181b; --g1:#14532d; --g2:#16a34a; --hot:#86efac; --amber:#f59e0b; --red:#ef4444;
  --font:"Geist",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--background);color:var(--foreground);font:14px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--background)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ring);outline-offset:2px}
.screen{max-width:640px;margin:0 auto;min-height:100%;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 104px}

/* shadcn primitives */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:36px;padding:0 16px;border-radius:calc(var(--radius) - 2px);border:1px solid transparent;font-size:14px;font-weight:500;white-space:nowrap;transition:background .15s,opacity .15s}
.btn:disabled{opacity:.5;pointer-events:none}
.btn-primary{background:var(--primary);color:var(--primary-foreground)}
.btn-primary:hover{background:#e4e4e7}
.btn-outline{background:transparent;border-color:var(--input)}
.btn-outline:hover,.btn-ghost:hover{background:var(--muted)}
.btn-ghost{background:transparent}
.btn-destructive{background:var(--destructive);color:#fff}
.btn-icon{width:36px;padding:0}
.btn-lg{height:48px;font-size:15px;border-radius:var(--radius)}
.btn svg{width:18px;height:18px}
.input{height:36px;width:100%;min-width:0;background:transparent;border:1px solid var(--input);border-radius:calc(var(--radius) - 2px);padding:0 12px;font-size:14px;outline:none}
.input:focus{border-color:var(--ring);box-shadow:0 0 0 1px var(--ring)}
textarea.input{height:auto;min-height:88px;padding:8px 12px;resize:none}
select.input{appearance:none}
.label{font-size:14px;font-weight:500}
.desc{font-size:13px;color:var(--muted-foreground)}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius)}
.badge{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;border:1px solid var(--border);font-size:11px;font-weight:500;color:var(--muted-foreground)}
.progress{height:6px;width:64px;background:var(--secondary);border-radius:999px;overflow:hidden}
.progress i{display:block;height:100%;background:var(--primary)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--background);display:flex;align-items:center;gap:12px;padding-block:16px 12px}
.h1{font-size:20px;font-weight:600;letter-spacing:-.01em;margin:0}
.title{min-width:0;display:flex;flex-direction:column}
.title b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.title span{font-size:12px;color:var(--muted-foreground)}

/* home */
.stack{display:flex;flex-direction:column;gap:12px}
#list{list-style:none;margin:0;padding:0}
#list li+li{border-top:1px solid var(--border)}
#list li button{width:100%;background:none;border:0;display:grid;grid-template-columns:1fr auto;gap:2px 12px;text-align:left;padding:12px 16px}
#list li button:hover{background:#18181b}
#list .a{font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#list .s{color:var(--muted-foreground);font-size:12px}
#list .p{grid-row:span 2;align-self:center;display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted-foreground);font-variant-numeric:tabular-nums}
.empty-list{color:var(--muted-foreground);padding:24px 16px;font-size:13px}

/* heat map */
.grid{display:grid;justify-content:center;align-content:center;padding:8px;overflow:hidden}
.cell{width:100%;height:100%;min-width:0;border:0;padding:0;border-radius:2px;background:var(--cell);transition:background .5s,box-shadow .5s}
.cell.ok{background:var(--g2)}
.cell.ok.na{background:var(--g1)}
.cell.check{background:var(--amber)}
.cell.issue{background:var(--red)}
.cell.hot{background:var(--hot);box-shadow:0 0 8px rgba(134,239,172,.6)}
.cell.picked{outline:2px solid var(--foreground);outline-offset:1px}
@media (prefers-reduced-motion:reduce){.cell{transition:none}.btn-destructive.live{animation:none}}

/* bottom bar */
.bar{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--background);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:12px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.bar>div{max-width:608px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.bar .btn{width:100%}
.btn-destructive.live{animation:pulse 1.4s infinite}
@keyframes pulse{50%{opacity:.8}}
.caption{font-size:13px;color:var(--muted-foreground);text-align:center;min-height:0}

/* dialogs / drawers */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.8);display:flex;align-items:flex-end;justify-content:center}
.drawer{width:100%;max-width:640px;max-height:92%;overflow:auto;background:var(--background);border:1px solid var(--border);border-bottom:0;border-radius:12px 12px 0 0;padding:20px max(16px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.drawer::before{content:"";align-self:center;width:48px;height:4px;border-radius:999px;background:var(--muted);margin:-8px 0 0}
.drawer h2{margin:0;font-size:17px;font-weight:600}
.field{display:flex;flex-direction:column;gap:8px}
.acts{display:flex;gap:8px}
.acts .btn{flex:1}
.msg{font-size:13px}
.msg.issue{color:var(--red)}.msg.check{color:var(--amber)}

/* toast (sonner-style) */
.toast{position:fixed;z-index:25;left:50%;transform:translateX(-50%);bottom:calc(88px + env(safe-area-inset-bottom,0px));width:min(calc(100% - 32px),420px);background:var(--background);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:13px;box-shadow:0 10px 30px rgba(0,0,0,.5)}

.preview{position:fixed;inset:0;z-index:30;background:var(--background);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.preview .pbar{display:flex;gap:8px;align-items:center;padding:10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--border)}
.preview .pbar span{flex:1;color:var(--muted-foreground);font-size:12px}
.preview iframe{flex:1;border:0;background:#71717a;width:100%}
</style>

<!-- HOME -->
<section id="home" class="screen">
  <header class="top">
    <h1 class="h1">EICR Voice</h1>
    <span class="badge" id="hmeta" style="margin-left:auto">on device</span>
  </header>
  <div class="stack">
    <input class="input" id="q" placeholder="Search address or ref…" autocomplete="off" aria-label="Search reports">
    <div class="card"><ul id="list"></ul></div>
    <p class="desc">Reports are stored on this device only.</p>
  </div>
</section>

<section id="report" class="screen" hidden>

    <div class="title"><b id="rAddr"></b><span id="rTpl"></span></div>
  </header>
  <div class="card grid" id="grid"></div>
  <!-- kept for later; not shown in this simplified view -->
  <div hidden><span id="pct"></span><i id="meter"></i><span id="counts"></span><div id="legend"></div><div id="log"></div>
    <button id="exp"></button><button id="del"></button><span id="delConfirm"><button id="delYes"></button></span></div>
</section>

<div class="bar" id="homeBar"><div><button class="btn btn-primary btn-lg" id="newBtn"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create new</button></div></div>
<div class="bar" id="talkBar" hidden><div>
  <div class="caption" id="caption" hidden></div>
  <button class="btn btn-primary btn-lg" id="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M19 10v1a7 7 0 0 1-14 0v-1M12 18v4"/></svg><span id="talkLbl">Talk</span></button>
</div></div>

<!-- TYPE / KEYBOARD DICTATION DRAWER -->
<div class="overlay" id="sayDrawer" hidden>
  <div class="drawer">
    <h2>Add reading</h2>
    <div class="field"><textarea class="input" id="say" placeholder="Ze 0.21, PFC 0.61, TN-C-S" aria-label="Reading"></textarea>
      <p class="desc">Tap the mic on your keyboard to dictate.</p></div>
    <div class="acts"><button class="btn btn-outline" id="sayCancel">Cancel</button><button class="btn btn-primary" id="saySend">Send</button></div>
  </div>
</div>

<!-- FIELD DRAWER -->
<div class="overlay" id="detailWrap" hidden>
  <div class="drawer" id="detail">
    <div><h2 id="dLabel"></h2><p class="desc" id="dKey" style="word-break:break-all;margin:4px 0 0"></p></div>
    <input class="input" id="dVal" autocomplete="off" aria-label="Value">
    <p class="msg" id="dMsg"></p>
    <div class="acts"><button class="btn btn-outline" id="dClose">Close</button><button class="btn btn-primary" id="dSave">Save</button></div>
  </div>
</div>

<!-- NEW REPORT DRAWER -->
<div class="overlay" id="newSheet" hidden>
  <form class="drawer" id="newForm">
    <div><h2>New report</h2><p class="desc" style="margin:4px 0 0">Electrical Installation Condition Report</p></div>
    <div class="field"><label class="label" for="nAddr">Installation address</label><input class="input" id="nAddr" required placeholder="12 Example Road, Testtown AB1 2CD"></div>
    <div class="field"><label class="label" for="nOcc">Occupier</label><input class="input" id="nOcc" placeholder="Tenant"></div>
    <div class="field"><label class="label" for="nClient">Person ordering the report</label><input class="input" id="nClient" placeholder="Name or agency"></div>
    <div class="field"><label class="label" for="nClientAddr">Their address</label><input class="input" id="nClientAddr"></div>
    <div class="field"><label class="label" for="nReason">Reason</label>
      <select class="input" id="nReason">
        <option>Electrical installation condition check prior to tenancy agreement</option>
        <option>Periodic inspection</option>
        <option>Sale of property</option>
        <option>Insurance requirement</option>
      </select></div>
    <div class="acts"><button type="button" class="btn btn-outline" id="newCancel">Cancel</button><button class="btn btn-primary" type="submit">Create</button></div>
  </form>
</div>

<div class="toast" id="toast" role="status" hidden></div>

<!-- EXPORT PREVIEW (kept for later) -->
<div class="preview" id="preview" hidden>
  <div class="pbar"><button class="btn btn-outline" id="pClose">Close</button><span id="pInfo"></span><button class="btn btn-primary" id="pSave">Save file</button></div>
  <iframe id="pFrame" title="Report preview"></iframe>
</div>

/* ---------- path helpers ---------- */
const getP=(o,p)=>p.split(".").reduce((a,k)=>a==null?undefined:a[k],o);
function setP(o,p,v){const ks=p.split(".");let a=o;ks.slice(0,-1).forEach(k=>{if(a[k]==null||typeof a[k]!=="object")a[k]={};a=a[k];});a[ks.at(-1)]=v;}
const isEmpty=v=>v===undefined||v===null||v==="";
const num=v=>{const n=parseFloat(String(v).replace(/[^0-9.\-]/g,""));return isNaN(n)?null:n;};

/* ---------- cell keys & status ---------- */
let cur=null, picked=null, hot=new Set();
function keyVal(k){ const d=cur.data, p=k.split(":");
  if(p[0]==="f") return getP(d,p[1]);
  if(p[0]==="o") return d.observations[+p[1]];
  if(p[0]==="b") return (d.boards[+p[1]]||{})[p[2]];
  if(p[0]==="c") return ((d.boards[+p[1]]||{}).circuits||[])[+p[2]]?.[+p[3]];
  if(p[0]==="i") return d.inspection[p[1]];
}
function keyLabel(k){ const d=cur.data,p=k.split(":");
  if(p[0]==="f") return p[1];
  if(p[0]==="o") return "observation "+(+p[1]+1);
  if(p[0]==="b") return (d.boards[+p[1]].ref||"DB")+" · board "+p[2];
  if(p[0]==="c"){ const r=d.boards[+p[1]].circuits[+p[2]]; return `${d.boards[+p[1]].ref} · circuit ${r[0]} ${r[1]?"("+r[1]+")":""} · ${COL_LABEL[+p[3]]}`; }
  if(p[0]==="i"){ const it=INSP.find(x=>x.id===p[1]); return "N "+p[1]+" · "+(it?it.label:""); }
}
function check(k){ // returns [status, message]
  const v=keyVal(k), p=k.split(":");
  if(p[0]==="o"){ if(!v) return ["empty",""]; return /C1|C2/.test(v.code)?["issue",v.code+" observation"]:["check",v.code+" observation"]; }
  if(isEmpty(v)) return ["empty",""];
  const s=String(v);
  if(p[0]==="i"){ if(/^C[12]$/.test(s)) return ["issue","unacceptable ("+s+")"]; if(/^(C3|FI)$/.test(s)) return ["check","coded "+s]; }
  if(p[0]==="c"){ const r=cur.data.boards[+p[1]].circuits[+p[2]], c=+p[3];
    if(c===28){ const zs=num(s), mx=num(r[12]); if(zs!=null&&mx!=null&&zs>mx) return ["issue",`Zs ${zs} exceeds max permitted ${mx}`]; }
    if(c>=23&&c<=26){ const ir=num(s); if(ir!=null&&ir<1) return ["issue",`insulation ${ir} MΩ is below 1 MΩ`]; if(ir!=null&&ir<2) return ["check",`insulation ${ir} MΩ is low`]; }
    if(c===29){ const t=num(s); if(t!=null&&t>300) return ["issue",`RCD ${t} ms is over 300 ms`]; if(t!=null&&t>40) return ["check",`RCD ${t} ms, check test current`]; }
    if(c===27&&/^x|fail/i.test(s)) return ["issue","polarity failed"];
  }
  if(k==="f:summary.overall"){ const bad=cur.data.observations.some(o=>/C1|C2/.test(o.code)); if(bad&&s==="SATISFACTORY") return ["issue","C1/C2 present but marked satisfactory"]; }
  return ["ok",""];
}
function allKeys(){ const d=cur.data, out=[];
  SECTIONS.forEach(s=>{
    if(s.f) s.f.forEach(f=>out.push("f:"+f));
    if(s.kind==="obs") d.observations.forEach((o,i)=>out.push("o:"+i));
    if(s.kind==="db") d.boards.forEach((b,bi)=>{ BOARD_F.forEach(f=>out.push(`b:${bi}:${f}`)); b.circuits.forEach((r,ci)=>COLS.forEach((c,x)=>{ if(x) out.push(`c:${bi}:${ci}:${x}`); })); });
    if(s.kind==="insp") INSP.forEach(i=>out.push("i:"+i.id));
  }); return out; }

function fillPct(r){ const keep=cur; cur=r; const ks=allKeys(); const n=ks.filter(k=>check(k)[0]!=="empty").length; cur=keep; return {n,t:ks.length,p:ks.length?Math.round(n/ks.length*100):0}; }

function renderHome(){
  const q=$("q").value.trim().toLowerCase();

}

function cellHTML(k,extra=""){ const [st]=check(k), v=keyVal(k);
  const na=st==="ok"&&/^N\/A$/i.test(String(v));
  return `<button class="cell ${st==="empty"?"":st}${na?" na":""}${hot.has(k)?" hot":""}${picked===k?" picked":""}${extra}" data-k="${k}" aria-label="${escH(keyLabel(k))}"></button>`; }

  const h=allKeys().map(k=>cellHTML(k)).join("");
  $("grid").innerHTML=h;

function fitGrid(){
  const g=$("grid"); if($("report").hidden) return;
  const n=g.children.length||1, w=g.clientWidth-16;
  const top=g.getBoundingClientRect().top, bar=$("talkBar").getBoundingClientRect().height||90;
  const leg=16;
  const h=Math.max(160,innerHeight-top-bar-leg-8)-16;
  let s=40,gap=2,cols=1;
  for(;s>=3;s-=.25){ gap=s>=9?2:1; cols=Math.max(1,Math.floor((w+gap)/(s+gap))); if(Math.ceil(n/cols)*(s+gap)-gap<=h) break; }
  g.style.height=(h+16)+"px"; g.style.gap=gap+"px";
  g.style.gridTemplateColumns=`repeat(${cols},${s}px)`; g.style.gridAutoRows=s+"px";
}
addEventListener("resize",()=>{ if(cur) fitGrid(); });
function renderDetail(){
  if(!picked){ $("detailWrap").hidden=true; return; }

  const v=keyVal(picked), p=picked.split(":"), [st,msg]=check(picked);
  $("dKey").textContent=picked.replace(/^f:/,"")+(p[0]==="f"&&ENUMS[p[1]]?"  ["+ENUMS[p[1]]+"]":"")+(p[0]==="i"?"  [✓|N/A|C1|C2|C3|FI|LIM|NV]":"");
  $("dLabel").textContent=keyLabel(picked);
  $("dVal").value=p[0]==="o"?(v?v.code+" "+v.text:""):(isEmpty(v)?"":String(v));
  $("dMsg").className="msg "+st; $("dMsg").textContent=msg||(st==="empty"?"empty, say it or type it":"");
}
function setKey(k,val){ const d=cur.data,p=k.split(":");
  if(p[0]==="f") setP(d,p[1],BOOL(p[1])?(/^(true|yes|y|✓|ok)$/i.test(val)?true:(val===""?"":false)):val);
  else if(p[0]==="o"){ const m=String(val).match(/^\s*(C1|C2|C3|FI)\s*(.*)$/i); if(val==="") d.observations.splice(+p[1],1); else if(m) d.observations[+p[1]]={...(d.observations[+p[1]]||{photos:[]}),code:m[1].toUpperCase(),text:m[2]}; }
  else if(p[0]==="b") d.boards[+p[1]][p[2]]=val;
  else if(p[0]==="c") d.boards[+p[1]].circuits[+p[2]][+p[3]]=val;
  else if(p[0]==="i") d.inspection[p[1]]=val;
}
function touch(){ cur.updated=Date.now(); if(cur.sample){} save(); }

/* ---------- log ---------- */
let toastT=0;
function toast(cls,txt){ const t=$("toast"); t.className="toast "+cls; t.textContent=txt; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,cls==="a"?3500:6000); }
function log(cls,txt){ if(cls!=="u") toast(cls,txt); const el=document.createElement("div"); el.className=cls; el.textContent=txt; $("log").prepend(el); while($("log").children.length>40) $("log").lastChild.remove(); }

/* ---------- AI parsing (only technical text is sent) ---------- */
let sample=null, dict=null, tts=null;
function catalog(){
  const d=cur.data;
  const fields=SECTIONS.filter(s=>s.f).flatMap(s=>s.f).filter(f=>!PRIVATE.has(f)).map(f=>f+(ENUMS[f]?` [${ENUMS[f]}]`:BOOL(f)?" [true|false]":"")).join("\n");
  const insp=SCHEDULE.map((g,gi)=>`${gi+1}: `+g.items.filter(i=>!i[2]).map(i=>`${i[0]} ${i[1].replace(/\s*\(.*$/,"").slice(0,48)}`).join("; ")).join("\n");
  const boards=d.boards.map(b=>`${b.ref}: `+(b.circuits.length?b.circuits.map(r=>r[0]+" "+(r[1]||"")).join(", "):"(no circuits)")).join("\n");
  return {fields,insp,boards};
}
let lastBoard="DB1";
function prompt(utter){ const c=catalog();
return `Convert an electrician's spoken site note into edits for a UK EICR (BS 7671). Reply with JSON only, no prose:
{"ops":[...],"say":"read-back under 14 words","unclear":"anything you could not map, else empty string"}
Op shapes:
{"op":"set","path":"<field path>","value":"..."}
{"op":"board","board":"<DB ref>","field":"<board field>","value":"..."}
{"op":"circuit","board":"<DB ref>","ref":"<circuit number>","field":"<circuit field>","value":"..."}
{"op":"insp","id":"<item id, or a section number like \\"2\\" for all its items>","value":"✓|N/A|C1|C2|C3|FI|LIM|NV"}
{"op":"obs","code":"C1|C2|C3|FI","text":"short observation"}
Rules: all values are strings without units. ok/good/pass/tick/fine = "✓" for inspection items and polarity. "n a"/"not applicable" = "N/A". Insulation "over range"/"greater than 999" = "999". Speech-to-text may garble numbers ("nought point five two" = "0.52", "point two one" = "0.21"). If no board is named use "${lastBoard}". To add a circuit, send its designation with field "designation". Max permitted Zs for B-type MCBs: B6 7.28→5.82 at 80%, B16 2.18, B32 1.10, B40 0.87 (80% values); fill max_zs only if spoken. Never invent values that were not spoken. Ignore names, addresses and phone numbers.
Field paths:
${c.fields}
Board fields: ${BOARD_F.join(", ")}
Circuit fields: ${COLS.slice(1).map((x,i)=>x+"="+COL_LABEL[i+1]).join(", ")}
Inspection items by section:
${c.insp}
Current boards and circuits:
${c.boards}
Note: """${utter}"""`; }

function applyOps(res){
  const d=cur.data; hot=new Set(); let n=0; const bad=[];
  const findBoard=ref=>{ ref=String(ref||lastBoard).trim(); const norm=s=>String(s).toLowerCase().replace(/[^a-z0-9]/g,"");
    let i=d.boards.findIndex(b=>norm(b.ref).startsWith(norm(ref))||norm(ref).startsWith(norm(b.ref)));
    if(i<0){ d.boards.push({ref,circuits:[]}); i=d.boards.length-1; } lastBoard=d.boards[i].ref; return i; };
  const known=new Set(SECTIONS.filter(s=>s.f).flatMap(s=>s.f));
  (res.ops||[]).forEach(o=>{ const v=String(o.value??"").trim();
    if(o.op==="set"&&known.has(o.path)&&!PRIVATE.has(o.path)){ setKey("f:"+o.path,v); hot.add("f:"+o.path); n++; }
    else if(o.op==="board"&&BOARD_F.includes(o.field)){ const bi=findBoard(o.board); d.boards[bi][o.field]=v; hot.add(`b:${bi}:${o.field}`); n++; }
    else if(o.op==="circuit"){ const x=COLS.indexOf(o.field); const bi=findBoard(o.board); const b=d.boards[bi];
      let ci=b.circuits.findIndex(r=>String(r[0])===String(o.ref));
      if(ci<0){ const r=Array(32).fill(""); r[0]=String(o.ref); b.circuits.push(r); b.circuits.sort((a,c)=>(num(a[0])??0)-(num(c[0])??0)); ci=b.circuits.findIndex(r=>String(r[0])===String(o.ref)); }
      if(x>0){ b.circuits[ci][x]=v; hot.add(`c:${bi}:${ci}:${x}`); n++; } }
    else if(o.op==="insp"){ const id=String(o.id); const hit=INSP.filter(i=>/^\d+$/.test(id)?i.id.split(".")[0]===id:(i.id===id||(i.id.startsWith(id)&&/[a-e]$/.test(i.id)&&i.id.length===id.length+1)));
      hit.forEach(i=>{ d.inspection[i.id]=v; hot.add("i:"+i.id); n++; }); if(!hit.length) bad.push("item "+id); }
    else if(o.op==="obs"&&/^(C1|C2|C3|FI)$/.test(o.code)){ d.observations.push({code:o.code,text:String(o.text||""),photos:[]}); hot.add("o:"+(d.observations.length-1)); n++; }
    else bad.push(JSON.stringify(o).slice(0,60));
  });
  touch(); renderReport();
  const issues=[...hot].map(k=>check(k)).filter(c=>c[0]==="issue"||c[0]==="check");
  return {n,bad,issues};
}

async function send(){
  const text=$("say").value.trim(); if(!text) return;
  $("say").value=""; $("sayDrawer").hidden=true; $("caption").hidden=true; log("u",text);
  if(!sample){ log("w","AI isn't available in this view. Tap a square to type a value."); return; }
  const tb=$("talk"); tb.disabled=true; $("talkLbl").textContent="Thinking…";
  try{
    const res=await sample.json(prompt(text),{modelTier:"quick",cache:false});
    const r=applyOps(res);
    log("a",(res.say||"done")+`  [${r.n} field${r.n===1?"":"s"}]`);
    r.issues.forEach(i=>log(i[0]==="issue"?"e":"w",i[1]));
    if(res.unclear) log("w","unclear: "+res.unclear);
    if(r.bad.length) log("w","skipped: "+r.bad.join(", "));
    if(tts&&res.say) tts.speak(res.say).catch(()=>{});
  }catch(e){
    if(e&&e.code==="not_granted"){ sample=null; log("e","AI access was declined. Tap cells to type values."); }
    else if(e&&e.code==="rate_limited") log("e","Too many notes at once. Wait a few seconds and send again.");
    else log("e","Could not parse that note ("+(e&&e.code||"error")+"). Try again or tap a cell.");
  }finally{ tb.disabled=false; updateTalk(); }
}

/* ---------- voice ---------- */
let listening=false, finalBuf="";
function updateTalk(){ const t=$("talk"); if(t.disabled) return;
  t.classList.toggle("btn-destructive",listening); t.classList.toggle("live",listening); t.classList.toggle("btn-primary",!listening);
  $("talkLbl").textContent=listening?"Stop":"Talk"; }
$("talk").addEventListener("click",()=>{
  if(dict){
    if(listening){ dict.stop().catch(()=>{}); return; }
    finalBuf=""; $("say").value=""; listening=true; updateTalk();
    $("caption").textContent="Listening…"; $("caption").hidden=false;
    dict.start({language:"en-GB"}).catch(e=>{ listening=false; $("caption").hidden=true; updateTalk();
      if(e&&e.code==="not_granted"){ dict=null; log("w","Microphone declined. Use the keyboard mic instead."); } });
    return; }
  $("sayDrawer").hidden=false; setTimeout(()=>$("say").focus(),50);
});
$("saySend").addEventListener("click",send);
$("sayCancel").addEventListener("click",()=>{ $("sayDrawer").hidden=true; });
$("sayDrawer").addEventListener("click",e=>{ if(e.target.id==="sayDrawer") $("sayDrawer").hidden=true; });
$("say").addEventListener("keydown",e=>{ if(e.key==="Enter"&&!e.shiftKey){ e.preventDefault(); send(); } });
$("detailWrap").addEventListener("click",e=>{ if(e.target.id==="detailWrap"){ picked=null; renderReport(); } });

/* ---------- navigation & events ---------- */
function openReport(id){ cur=reports.find(r=>r.id===id); if(!cur) return; picked=null; hot=new Set(); $("log").innerHTML="";
  lastBoard=cur.data.boards[0]?.ref||"DB1";
  $("home").hidden=true; $("homeBar").hidden=true; $("report").hidden=false; $("talkBar").hidden=false; $("delConfirm").hidden=true;
  renderReport(); scrollTo(0,0); }
function goHome(){ cur=null; ["sayDrawer","detailWrap","toast"].forEach(i=>$(i).hidden=true); $("report").hidden=true; $("talkBar").hidden=true; $("home").hidden=false; $("homeBar").hidden=false; renderHome(); }
$("list").addEventListener("click",e=>{ const b=e.target.closest("button[data-id]"); if(b) openReport(b.dataset.id); });
$("q").addEventListener("input",renderHome);
$("back").addEventListener("click",goHome);
$("grid").addEventListener("click",e=>{ const c=e.target.closest(".cell[data-k]"); if(!c) return; picked=picked===c.dataset.k?null:c.dataset.k; renderReport(); });
$("dSave").addEventListener("click",()=>{ if(!picked) return; setKey(picked,$("dVal").value.trim()); hot=new Set([picked]); touch(); picked=null; renderReport(); });
$("dClose").addEventListener("click",()=>{ picked=null; renderReport(); });
$("dVal").addEventListener("keydown",e=>{ if(e.key==="Enter") $("dSave").click(); });
$("newBtn").addEventListener("click",()=>{ $("newForm").reset(); $("newSheet").hidden=false; setTimeout(()=>$("nAddr").focus(),50); });
$("newCancel").addEventListener("click",()=>$("newSheet").hidden=true);
$("newSheet").addEventListener("click",e=>{ if(e.target.id==="newSheet") $("newSheet").hidden=true; });
$("newForm").addEventListener("submit",e=>{ e.preventDefault();
  const r=blankReport({addr:$("nAddr").value.trim(),occ:$("nOcc").value.trim(),client:$("nClient").value.trim(),clientAddr:$("nClientAddr").value.trim(),reason:$("nReason").value});
  reports.push(r); save(); $("newSheet").hidden=true; openReport(r.id); });
$("del").addEventListener("click",()=>$("delConfirm").hidden=false);
$("delYes").addEventListener("click",()=>{ reports=reports.filter(r=>r!==cur); if(!reports.length) reports=[makeSample()]; save(); goHome(); });

/* ---------- export ---------- */
let exportHTML="", exportName="";
$("exp").addEventListener("click",async()=>{
  const f=fillPct(cur);
  try{
    const tpl=await (await fetch("eicr-template.html")).text();
    const data=clone(cur.data); data.inspection=Object.fromEntries(Object.entries(data.inspection).filter(([k,v])=>v));
    exportHTML=tpl.replace(/(<script type="application\/json" id="report-data">)[\s\S]*?(<\/script>)/,(m,a,b)=>a+"\n"+JSON.stringify(data,null,1).replace(/<\//g,"<\\/")+"\n"+b);
    exportName=`EICR_${data.meta.serial}_${(data.installation.address||"report").replace(/[^A-Za-z0-9]+/g,"_").slice(0,40)}.html`;
    $("pInfo").textContent=`${f.p}% filled · ${f.t-f.n} empty fields show as N/A`;
    $("pFrame").srcdoc=exportHTML; $("preview").hidden=false;
  }catch(e){ log("e","Could not load the report template. Check your connection and try again."); }
});
$("pClose").addEventListener("click",()=>{ $("preview").hidden=true; $("pFrame").srcdoc=""; });
$("pSave").addEventListener("click",async()=>{
  const dl=window.claude&&await claude.use("downloads");
  if(!dl){ $("pInfo").textContent="Saving files is not available in this view."; return; }
  try{ await dl.save({filename:exportName,data:new Blob([exportHTML],{type:"text/html"})}); $("pInfo").textContent="Saved. Open it on the device to print or email as PDF."; }
  catch(e){ $("pInfo").textContent=e&&e.code==="declined"?"Save cancelled.":"Could not save ("+(e&&e.code||"error")+")."; }
});

/* ---------- boot ---------- */
load(); renderHome();
if(window.claude&&claude.use){
  claude.use("sample").then(s=>{ sample=s; });
  claude.use("tts").then(t=>{ tts=t; });
  claude.use("dictation").then(d=>{ dict=d; if(!d){ updateTalk(); return; }
    d.onPartial(({text})=>{ $("say").value=(finalBuf+" "+text).trim(); $("caption").textContent=$("say").value||"Listening…"; });
    d.onFinal(({text})=>{ finalBuf=(finalBuf+" "+text).trim(); $("say").value=finalBuf; $("caption").textContent=finalBuf; });
    d.onState(({state})=>{ if(state==="idle"&&listening){ listening=false; updateTalk(); if($("say").value.trim()) send(); else $("caption").hidden=true; } else updateTalk(); });
    updateTalk(); });
}
</script>
