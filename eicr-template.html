<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EICR Digital Template</title>
<style>
:root{
  --brand:#6a0f9e; --fill:#e4e4e4; --line:#333; --ok:#5fe07a; --c3:#f39a55; --c2:#e8554e; --c1:#b3141b; --fi:#4d8be8;
}
*{box-sizing:border-box}
body{margin:0;background:#7d7d85;font-family:Arial,Helvetica,sans-serif;font-size:8pt;color:#111}
.toolbar{position:sticky;top:0;z-index:5;background:#222;color:#fff;padding:8px 16px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.toolbar button{background:var(--brand);color:#fff;border:0;padding:7px 14px;border-radius:4px;font-weight:bold;cursor:pointer}
.toolbar span{opacity:.75;font-size:9pt}
.pages{overflow-x:auto;padding:10px 0}
.page{width:210mm;min-height:297mm;padding:7mm 9mm 13mm;background:#fff;margin:0 auto 10mm;position:relative;box-shadow:0 2px 10px rgba(0,0,0,.35)}
.page.land{width:297mm;min-height:210mm;page:land}
.pfoot{position:absolute;left:9mm;right:9mm;bottom:6mm;display:flex;justify-content:space-between;align-items:flex-end;font-size:7pt;font-weight:bold}
.pfoot .pn{font-size:10pt}
@page{size:A4;margin:0}
@page land{size:A4 landscape;margin:0}
@media print{
  body{background:#fff}.toolbar{display:none}.pages{padding:0;overflow:visible}
  .page{margin:0;box-shadow:none;break-after:page}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
/* header */
.hdr{display:flex;gap:6mm;margin-bottom:4mm}
.logo{width:26mm;height:26mm;border:1px dashed #aaa;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;font-size:7pt}
.hdr .meta{display:flex;gap:2mm;background:#ececec;padding:2mm 3mm;font-size:9pt;margin-bottom:2mm}
.hdr .meta b{margin-right:3mm}.hdr .meta .grey{background:#d3d3d3;padding:0 2mm}
.hdr h1{color:var(--brand);font-size:20pt;margin:1mm 0 0;line-height:1.15}
.hdr .sub{color:#666;font-weight:bold;font-size:9pt;margin-top:1mm}
/* sections */
.sec{border:1.4px solid var(--line);margin-bottom:2mm}
.sec>h2{background:var(--brand);color:#fff;margin:0;padding:1.3mm 3mm;font-size:10pt;display:flex;justify-content:space-between;align-items:center;gap:4mm}
.sec>h2 small{font-size:6pt;font-weight:normal;max-width:60%;text-align:right}
.sec>.b{background:var(--fill);padding:2mm}
.row{display:flex;gap:2mm;align-items:center;margin-bottom:1.2mm;flex-wrap:nowrap}
.row:last-child{margin-bottom:0}
.lbl{font-weight:bold;white-space:nowrap}
.lbl.n{font-weight:normal}
.f{background:#fff;padding:1.4mm 2mm;min-height:6mm;flex:1;font-size:7.5pt;display:flex;align-items:center}
.f.tall{min-height:9mm;align-items:flex-start}
.f.c{justify-content:center}
.box{display:inline-flex;align-items:center;justify-content:center;min-width:8mm;height:6mm;border:1px solid #555;background:#fff;font-size:7pt;padding:0 1mm}
.verdict{background:#fff;font-size:12pt;font-weight:bold;text-align:center;padding:1.5mm;width:80mm;margin:1mm auto}
.note{font-size:6pt;color:#333;line-height:1.35}
.bold{font-weight:bold}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:3mm}
.sig{height:9mm;background:#fff;display:flex;align-items:center;justify-content:center;color:#999;font-style:italic}
/* observations */
.bar{background:var(--brand);color:#fff;padding:5mm 6mm;display:flex;justify-content:space-between;align-items:center;margin-bottom:4mm}
.bar h2{margin:0;font-size:15pt}.bar .r{text-align:right;font-size:9pt;line-height:1.6}
table.obs{width:100%;border-collapse:collapse;font-size:8.5pt}
table.obs th{background:#ececec;text-align:left;padding:2mm}
table.obs td{border-bottom:1px solid #ccc;padding:2mm}
.code{font-weight:bold;text-align:center;width:28mm}
.ph{display:flex;gap:2mm;justify-content:flex-end}
.ph div,.ph img{width:30mm;height:22mm;border:1px solid #ccc;background:#f2f2f2;object-fit:cover;display:flex;align-items:center;justify-content:center;color:#999;font-size:7pt}
.obsitem{display:flex;gap:4mm;border-left:3px solid var(--c3);padding:2mm 3mm;margin-bottom:3mm}
.chip{display:inline-block;padding:1mm 4mm;border-radius:2px;color:#111;font-weight:bold;margin-right:3mm}
/* DB schedule */
.dbh{display:grid;grid-template-columns:repeat(12,auto);border:1px solid var(--line);font-size:7pt}
.dbh div{padding:1.2mm 1.5mm;border-right:1px solid #bbb;border-bottom:1px solid #bbb;display:flex;align-items:center}
.dbh .k{background:#e8e8e8;font-weight:bold}
table.ct{width:100%;border-collapse:collapse;font-size:6.3pt;table-layout:fixed}
table.ct th,table.ct td{border:1px solid #555;text-align:center;padding:.8mm .3mm}
table.ct th{background:#fff;font-weight:bold}
table.ct th.v{height:30mm;vertical-align:bottom}
table.ct th.v span{writing-mode:vertical-rl;transform:rotate(180deg);display:inline-block;white-space:nowrap}
table.ct td.d{text-align:center;font-size:6.6pt}
.purple{background:var(--brand);color:#fff;font-weight:bold;padding:1.4mm 3mm;font-size:10pt}
/* inspection schedule */
.legend{background:#f1f1f3;border:1px solid #ddd;padding:2mm 3mm;display:grid;grid-template-columns:repeat(4,1fr);gap:1mm;font-size:7.5pt;margin-bottom:3mm}
table.is{width:100%;border-collapse:collapse;font-size:8.5pt}
table.is th{text-align:left;border-bottom:2px solid var(--brand);padding:1.5mm}
table.is td{border-bottom:1px solid #ccc;padding:2mm 1.5mm;vertical-align:middle}
table.is tr.sh td{background:#e6e7ea;font-weight:bold;font-size:10pt}
table.is tr.sn td{font-style:italic;color:#666;font-size:7.5pt;border:0}
table.is td.o{width:32mm}
.out{display:block;border:1px solid #ccc;border-radius:2px;text-align:center;padding:1.5mm;font-weight:bold}
.out.ok{background:var(--ok);border-color:var(--ok)}.out.C3{background:var(--c3);border-color:var(--c3)}
.out.C2{background:var(--c2);color:#fff}.out.C1{background:var(--c1);color:#fff}.out.FI{background:var(--fi);color:#fff}
/* guidance */
.gtitle{background:#ddd;text-align:center;padding:4mm;margin:-9mm -9mm 6mm}
.gtitle h2{margin:0;font-size:17pt}
.gl{font-size:8pt;line-height:1.45;padding:0 4mm}
table.codes{width:100%;border-collapse:collapse;margin-top:8mm;font-size:7.5pt}
table.codes td,table.codes th{border:1px solid #555;text-align:center;padding:1.5mm}
table.codes caption{background:var(--brand);color:#fff;font-weight:bold;padding:1mm}
</style>
</head>

  <button onclick="window.print()">Print / Save PDF</button>

      <tr>${groups.map(([t,n])=>`<th colspan="${n}" style="${t?"":"border-bottom:0"}">${t}</th>`).join("")}</tr>
      <tr>${CIRCUIT_COLS.map((c,i)=>i===1?`<th style="border-top:0">${c}</th>`:`<th class="v"><span>${c}</span></th>`).join("")}</tr>
      ${b.circuits.map(r=>`<tr>${r.map((v,i)=>`<td${i===1?' class="d"':''}>${esc(v)}</td>`).join("")}</tr>`).join("")}
      ${Array(Math.max(0,14-b.circuits.length)).fill(`<tr>${"<td>&nbsp;</td>".repeat(32)}</tr>`).join("")}
    </table>
    <div class="note" style="margin-top:2mm">Not all SPDs have visible functionality indication. RCD effectiveness is verified using an alternating current test at rated residual operating current (IΔn). Not all AFDDs have a test button.</div>`, true);
}

function p7(){
  const t=D.instruments,dec=D.declaration;
  const f=(l,v)=>`<div class="row"><span class="lbl" style="width:42mm;text-align:right">${l}</span><div class="f">${esc(v)}</div></div>`;
  return page(`
    ${sec('<span style="flex:1;text-align:center">TEST INSTRUMENTS USED</span>',`<div class="grid2"><div>${f("Earth fault loop impedance",t.efli)}${f("Insulation resistance",t.insulation)}${f("Continuity",t.continuity)}</div><div>${f("RCD",t.rcd)}${f("MFT",t.mft)}${f("Other",t.other)}</div></div>
      <div class="grid2" style="margin-top:3mm;border-top:1px solid #999;padding-top:3mm"><div class="row"><span class="lbl">Inspected by: Signature</span><div class="f sig" style="height:22mm">signature</div></div>
      <div>${f("Name (CAPITALS)",dec.inspector_name)}${f("Date of inspection",dec.inspector_date)}</div></div>`)}
    ${sec('<span style="flex:1;text-align:center">REMARKS</span>',`<div class="bold" style="margin:2mm 0 3mm">Special installations or locations present, if any. Details of circuits and/or installed equipment vulnerable to damage when testing and/or remarks:</div>
      <div class="f tall" style="min-height:150mm;white-space:pre-wrap">${raw(D.remarks)}</div>`)}
  `);
}

function inspectionPages(){
  const rows=[];
  SCHEDULE.forEach(g=>{rows.push({h:g.s});if(g.note)rows.push({note:g.note});g.items.forEach(it=>rows.push({it}));});
  const cell=(id,isHead)=>{ if(isHead) return ""; const v=D.inspection[id]||"N/A";
    const cls=v==="✓"?"ok":(["C1","C2","C3","FI"].includes(v)?v:""); return `<span class="out ${cls}">${v}</span>`; };
  const pages=[];let cur=[],weight=0;const MAX=19;
  rows.forEach(r=>{const w=r.it?(r.it[1].length>110?1.6:1):(r.h?1.3:.7); if(weight+w>MAX){pages.push(cur);cur=[];weight=0;} cur.push(r);weight+=w;});
  if(cur.length)pages.push(cur);
  return pages.map((pr,pi)=>page(`${bar("N. INSPECTION SCHEDULE FOR A DISTRIBUTION BOARD INSTALLATION"+(pi?" (CONTINUED)":""))}
    <div class="legend"><span>✓ Acceptable</span><span>C1 / C2 Unacceptable</span><span>C3 Improvement</span><span>FI Further investigation</span><span>N/A Not applicable</span><span>LIM Limitation</span><span>NV Not verified</span></div>
    <table class="is"><tr><th style="width:14mm">ITEM</th><th>DESCRIPTION</th><th class="o" style="text-align:right">OUTCOME</th></tr>
    ${pr.map(r=>r.h?`<tr class="sh"><td colspan="3">${r.h}</td></tr>`:r.note?`<tr class="sn"><td colspan="3">${r.note}</td></tr>`:
      `<tr><td>${r.it[3]?"":r.it[0]}</td><td style="${r.it[2]?"font-weight:bold":""}${r.it[3]?"padding-left:6mm":""}">${r.it[3]?"* ":""}${r.it[1]}</td><td class="o">${cell(r.it[0],r.it[2])}</td></tr>`).join("")}
    </table>`)).join("");
}

function guidance(){
  const pts=[
    "This report confirms, so far as reasonably practicable, whether the electrical installation is in a satisfactory condition for continued use (Section E), and identifies any damage, deterioration, defects or dangerous conditions (Section K).",
    "The report is only valid when accompanied by the Inspection Schedule(s) and the Schedule(s) of Circuit Details and Test Results.",
    "The person ordering the report should receive the original; the inspector retains a duplicate.",
    "Keep the original safe and make it available to anyone inspecting or working on the installation in future, including new owners or occupiers.",
    "Section D sets out the extent and limitations agreed before the inspection with the person ordering it and any other interested parties.",
    "Any operational limitations met during the inspection (e.g. no access to part of the installation) are recorded in Section D.",
    "C1 (Danger present): remedial work by a competent person is needed immediately.",
    "C2 (Potentially dangerous): remedial work by a competent person is needed as a matter of urgency.",
    "C3 (Improvement recommended): advisory only; does not affect the overall assessment.",
    "FI (Further investigation): an apparent deficiency that could not be fully identified; investigate without delay. An FI alone does not make the installation unsatisfactory.",
    "The installation should be re-inspected by the date given in Section F.",
    "Test any RCD six-monthly using its ‘T’/‘Test’ button; if it does not switch off, seek expert advice.",
    "Test any AFDD with a manual test facility six-monthly, following manufacturer’s instructions.",
    "Check any SPD status indicator; if it shows not operational, seek expert advice.",
    "Where alternative or additional sources of supply exist, warning notices should be present at the origin/meter, consumer unit and all points of isolation."
  ];
  const codes=[["A","Thermoplastic insulated/ sheathed cables"],["B","Thermoplastic cables in metallic conduit"],["C","Thermoplastic cables in non-metallic conduit"],["D","Thermoplastic cables in metallic trunking"],["E","Thermoplastic cables in non-metallic trunking"],["F","Thermoplastic SWA cables"],["G","Thermosetting SWA cables"],["H","Mineral insulated cables"],["O","Other"]];
  return page(`<div class="gtitle"><h2>CONDITION REPORT — GUIDANCE FOR RECIPIENTS</h2><b>This report is an important document which should be retained for future reference</b></div>
    <div class="note" style="text-align:center;margin-bottom:4mm;color:#a00">POC note: replace with the official recipient guidance wording from your certification scheme.</div>
    <ol class="gl">${pts.map(p=>`<li style="margin-bottom:2mm">${p}</li>`).join("")}</ol>
    <table class="codes"><caption>CODES FOR TYPES OF WIRING</caption><tr>${codes.map(c=>`<th>${c[0]}</th>`).join("")}</tr><tr>${codes.map(c=>`<td><b>${c[1]}</b></td>`).join("")}</tr></table>`);
}

document.getElementById('pages').innerHTML =
  p1()+p2()+p3()+p4()+D.boards.map(dbPage).join("")+p7()+inspectionPages()+guidance();
const all=document.querySelectorAll('.page .pn');
all.forEach((el,i)=>el.textContent=`Page ${i+1} of ${all.length}`);
</script>
</body>
</html>
